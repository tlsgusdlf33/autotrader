# AutoTrader.zip 하나만 올려두면 GitHub가 알아서 풀어서 APK를 만듭니다.
#
# 폰 브라우저에서는 폴더를 끌어다 놓을 수 없어 구조가 깨집니다.
# 그래서 소스는 zip 하나로 두고, 빌드할 때 여기서 풉니다.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: -Xmx5g -Dorg.gradle.daemon=false

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: 압축 풀기
        run: |
          set -e
          if [ ! -f AutoTrader.zip ]; then
            echo "::error::AutoTrader.zip 이 저장소에 없습니다. 저장소 최상단에 올려주세요."
            exit 1
          fi
          mkdir -p src
          unzip -q AutoTrader.zip -d src

          # zip 안에 폴더가 한 겹 더 있는 경우(AutoTrader/AutoTrader/...)를 자동 보정
          if [ ! -f src/settings.gradle.kts ]; then
            inner=$(find src -maxdepth 2 -name settings.gradle.kts | head -1)
            if [ -z "$inner" ]; then
              echo "::error::settings.gradle.kts 를 찾을 수 없습니다. zip 내용을 확인해주세요."
              find src -maxdepth 2 | head -30
              exit 1
            fi
            mv "$(dirname "$inner")" src_fixed
            rm -rf src && mv src_fixed src
          fi

          echo "── 풀린 구조 ──"
          ls -la src
          echo ""
          test -f src/app/build.gradle.kts && echo "app/build.gradle.kts 확인" || (echo "::error::app 폴더가 없습니다"; exit 1)

      - name: 광고 ID 적용
        run: |
          set -e
          STR=src/app/src/main/res/values/strings.xml
          if [ ! -f admob.txt ]; then
            echo "admob.txt 가 없어 테스트 광고 ID를 그대로 씁니다."
            exit 0
          fi
          APP_ID=$(grep -E '^APP_ID=' admob.txt | head -1 | cut -d= -f2- | tr -d ' \r')
          BANNER_ID=$(grep -E '^BANNER_ID=' admob.txt | head -1 | cut -d= -f2- | tr -d ' \r')

          # 앱 ID는 물결(~), 광고 단위 ID는 슬래시(/). 바꿔 넣는 실수가 잦아서 미리 잡는다.
          case "$APP_ID" in
            *~*) ;;
            *) echo "::error::APP_ID 에 물결(~)이 없습니다. 광고 단위 ID를 잘못 넣으신 것 같습니다: $APP_ID"; exit 1;;
          esac
          case "$BANNER_ID" in
            */*) ;;
            *) echo "::error::BANNER_ID 에 슬래시(/)가 없습니다. 앱 ID를 잘못 넣으신 것 같습니다: $BANNER_ID"; exit 1;;
          esac

          # 슬래시가 값에 들어있으므로 sed 구분자로 | 를 쓴다
          sed -i "s|<string name=\"admob_app_id\">[^<]*</string>|<string name=\"admob_app_id\">$APP_ID</string>|" "$STR"
          sed -i "s|<string name=\"admob_banner_id\">[^<]*</string>|<string name=\"admob_banner_id\">$BANNER_ID</string>|" "$STR"

          echo "적용된 광고 ID:"
          grep -E 'admob_(app|banner)_id' "$STR"
          case "$APP_ID" in
            ca-app-pub-3940256099942544*) echo "::warning::아직 구글 테스트 ID입니다 — 수익이 발생하지 않습니다.";;
          esac

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 파이썬 3.11 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 서명 키 확인
        run: |
          set -e
          # ⚠️ 이 단계가 이 워크플로에서 가장 중요하다.
          # 안드로이드는 '같은 키로 서명된 APK'만 기존 앱 위에 덮어 설치하게 해준다.
          # gradle 이 자동으로 만드는 debug 키는 빌드 기계마다 새로 생기는데,
          # 여기는 매번 새 기계라서 빌드마다 서명이 달라졌다. 그래서 새 APK 를
          # 깔려면 앱을 지워야 했고, 지우면 앱 폴더가 통째로 날아가
          # API 키도 거래 기록(어떤 매매법으로 샀는지)도 전부 사라졌다.
          # 저장소에 함께 둔 고정 키로 서명하면 그냥 덮어 설치된다.
          if [ ! -f src/app/autotrader.jks ]; then
            echo "::error::app/autotrader.jks 가 없습니다. 이 파일이 없으면 빌드할 때마다 서명이 달라져서, 새 APK 를 깔 때 앱을 지워야 하고 API 키·거래 기록이 사라집니다. 저장소에 함께 올려주세요(.gitignore 의 *.jks 에 걸리지 않게 !app/autotrader.jks 예외가 들어있습니다)."
            exit 1
          fi
          echo "서명 키 지문 — 빌드마다 이 값이 같아야 덮어 설치가 됩니다:"
          keytool -list -v -keystore src/app/autotrader.jks -storepass autotrader | grep "SHA256:"

      - name: APK 빌드
        working-directory: src
        env:
          # ⚠️ 덮어 설치가 되려면 versionCode 가 이전보다 작으면 안 된다.
          # 깃허브 실행 번호는 빌드할 때마다 1씩 커지므로 그대로 쓴다.
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 결과 확인
        run: ls -lh src/app/build/outputs/apk/debug/

      - name: APK 내려받기용으로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: autotrader-apk
          path: src/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 실패 시 로그 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/app/build/outputs/logs/
            src/build/reports/
          retention-days: 7
          if-no-files-found: ignore
